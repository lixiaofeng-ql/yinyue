name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 重新抓取榜单 / 歌单 / 歌词，保证线上数据新鲜
      - name: Fetch music data
        run: npm run fetch
        continue-on-error: true

      # 抓取赞美诗歌（教会敬拜 / 圣歌）歌单与曲目
      # 仓库里已提交 data/praise.json；CI 服务器 IP 容易被网易云限流，
      # 所以只在文件缺失时才现场抓取，避免把已有数据覆盖成几十首。
      - name: Fetch praise songs
        run: |
          if [ ! -f data/praise.json ]; then
            npm run fetch:praise
          else
            echo "data/praise.json 已存在，跳过抓取"
          fi
        continue-on-error: true

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
